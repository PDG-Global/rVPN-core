name: Audit

# cargo audit: weekly, plus any PR that changes the dependency lockfile.
# The secret-scanning gate asks "did anyone commit a secret"; this asks
# "does the lockfile still resolve to something with a known CVE".
on:
  schedule:
    - cron: '0 2 * * 1'
  pull_request:
    paths:
      - 'rvpn/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rvpn

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit
